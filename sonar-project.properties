# Análisis estático en SonarCloud (ESC-MANT-01). Confirma organization y projectKey en SonarCloud > Information.
sonar.organization=spidersitpverse
sonar.projectKey=SpiderSitpverse_SitpVerseFront
sonar.projectName=SitpVerse Front

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test/**
sonar.exclusions=dist/**,node_modules/**,coverage/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,src/main.tsx,src/types/**,src/data/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
