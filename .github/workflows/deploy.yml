name: Deploy a Azure Static Web Apps

# push a main: compila y publica.  Pull request: solo comprueba que compila (no publica).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # La URL del back sale de .env.production (VITE_API_URL).
      - run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      # Se publica con el CLI oficial de Static Web Apps (el mismo con el que se probó a mano).
      # public/staticwebapp.config.json (fallback de SPA) viaja dentro de dist.
      - name: Publicar dist
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$SWA_CLI_DEPLOYMENT_TOKEN" ]; then
            echo "::error::Falta el secreto AZURE_STATIC_WEB_APPS_API_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          npx --yes @azure/static-web-apps-cli deploy ./dist --env production
